name: mightys_pulse
description: Privacy-first analytics for Flutter apps and games. No device IDs, offline queue, tiny. Send named signals and see them in the Pulse dashboard.
version: 0.9.0
homepage: https://pulse.mightys.dev
repository: https://github.com/MightyS-dev/pulse-flutter
issue_tracker: https://github.com/MightyS-dev/pulse-flutter/issues
documentation: https://pulse.mightys.dev/docs/flutter/
topics:
  - analytics
  - privacy
  - telemetry
  - events
  - offline-first
platforms:
  android:
  ios:
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  path_provider: ^2.1.5
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
